[package]
name = "climg"
version = "0.1.0"
edition = "2024"
authors = ["jorgvt"]
description = "Fast, high-resolution terminal image viewer for remote servers"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
crossterm = "0.28"
anyhow = "1.0"
notify = "6.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3.16"

